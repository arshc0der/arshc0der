<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="92" viewBox="0 0 900 92" role="img" aria-labelledby="t d"><title id="t">Dev notes</title><desc id="d">Rotating one-line developer notes.</desc><style>.m{font-family:ui-monospace,SFMono-Regular,'SF Mono','JetBrains Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}.s{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1222"/><stop offset="1" stop-color="#070b14"/></linearGradient><clipPath id="clipAll"><rect width="900" height="92" rx="18"/></clipPath><linearGradient id="ag" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient></defs><rect x=".5" y=".5" width="899" height="91" rx="16" fill="url(#bg)" stroke="rgba(148,163,184,.18)" /><text x="36" y="62" class="m" font-size="46" font-weight="800" fill="url(#ag)">{</text><text x="864" y="62" text-anchor="end" class="m" font-size="46" font-weight="800" fill="url(#ag)">}</text><text x="450.0" y="54" text-anchor="middle" class="m" font-size="19" fill="#e6edf7" opacity="0">Read the source. Then read it again.<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.0;0.02222;0.17778;0.2;1.0" dur="22.5s" repeatCount="indefinite"/></text><text x="450.0" y="54" text-anchor="middle" class="m" font-size="19" fill="#e6edf7" opacity="0">Every bug is a lesson in disguise.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0;0.19956;0.22222;0.37778;0.4;1.0" dur="22.5s" repeatCount="indefinite"/></text><text x="450.0" y="54" text-anchor="middle" class="m" font-size="19" fill="#e6edf7" opacity="0">Build it small, break it early, ship it often.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0;0.39956;0.42222;0.57778;0.6;1.0" dur="22.5s" repeatCount="indefinite"/></text><text x="450.0" y="54" text-anchor="middle" class="m" font-size="19" fill="#e6edf7" opacity="0">Curiosity compiles faster than ambition.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0;0.59956;0.62222;0.77778;0.8;1.0" dur="22.5s" repeatCount="indefinite"/></text><text x="450.0" y="54" text-anchor="middle" class="m" font-size="19" fill="#e6edf7" opacity="0">Today&#x27;s side project is tomorrow&#x27;s skill set.<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0;0.79956;0.82222;0.97778;1.0" dur="22.5s" repeatCount="indefinite"/></text><text x="450.0" y="80" text-anchor="middle" class="m" font-size="10.5" letter-spacing="3" fill="#8b9ab3">DEV NOTES</text></svg>
